<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7">
  <title>Crop Circles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Crop Circles</h1>
    </header>

    <main class="app-main">
      <section class="upload-section" id="uploadSection">
        <label class="upload-area" for="fileInput">
          <div class="upload-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <span class="upload-title">Choose a Photo</span>
          <span class="upload-subtitle">Cropped to a circle, full resolution</span>
          <input type="file" id="fileInput" accept="image/*" class="visually-hidden" aria-label="Choose a photo to crop">
        </label>
      </section>

      <section class="editor-section" id="editorSection" hidden>
        <div class="editor-canvas-wrap">
          <canvas id="editorCanvas"></canvas>
        </div>
        <div class="editor-actions">
          <button class="btn btn-primary" id="cropBtn">Crop</button>
          <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        </div>
      </section>

      <section class="result-section" id="resultSection" hidden>
        <div class="result-wrapper">
          <img id="resultImg" alt="Circle-cropped photo">
        </div>
        <div class="action-bar">
          <button class="btn btn-primary" id="saveBtn">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Save
          </button>
        </div>
        <button class="btn btn-ghost" id="resetBtn">Choose Another Photo</button>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
